<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexGen Academy | Contact Us</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="description" content="Get in touch with us.">
</head>
<body>

    <header class="glass">
        <nav>
            <div class="logo">NexGen Academy</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="courses.html">Courses</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="auth.html" class="btn btn-outline" style="padding: 0.4rem 1rem;">Login / Register</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1 class="section-title">Get in Touch</h1>

        <div class="grid grid-2">
            <!-- Contact Info -->
            <div>
                <div class="glass" style="padding: 2rem; margin-bottom: 2rem;">
                    <h3 style="margin-bottom: 1.5rem; color: var(--primary);">Contact Information</h3>
                    <div style="margin-bottom: 1rem;">
                        <strong style="color: white;">📍 Address:</strong>
                        <p class="text-muted" style="margin-top: 0.2rem; margin-left: 1.5rem;">123 Innovation Drive,<br>Tech City, TC 90210</p>
                    </div>
                    <div style="margin-bottom: 1rem;">
                        <strong style="color: white;">📧 Email:</strong>
                        <p class="text-muted" style="margin-top: 0.2rem; margin-left: 1.5rem;">support@nexgenacademy.com</p>
                    </div>
                    <div>
                        <strong style="color: white;">📞 Phone:</strong>
                        <p class="text-muted" style="margin-top: 0.2rem; margin-left: 1.5rem;">+1 (555) 123-4567</p>
                    </div>
                </div>
            </div>

            <!-- Contact Form -->
            <div>
                <form class="glass" style="padding: 2rem;">
                    <h3 style="margin-bottom: 1.5rem;">Send us a message</h3>
                    <div class="form-group">
                        <label for="contact-name">Name</label>
                        <input type="text" id="contact-name" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-email">Email Address</label>
                        <input type="email" id="contact-email" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="contact-message">Message</label>
                        <textarea id="contact-message" class="form-control" rows="5" required style="resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <div class="container" style="padding: 0 2rem;">
            <p>&copy; 2026 NexGen Academy. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
